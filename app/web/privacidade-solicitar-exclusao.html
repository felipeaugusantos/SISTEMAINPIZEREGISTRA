<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Excluir meus dados — Zé Registra</title>
  <link rel="stylesheet" href="/static/styles.css?v=60">
</head>
<body class="auth-body">
  <main class="auth-card">
    <a href="/" class="auth-brand"><img src="/static/assets/personagem.png" alt=""><strong>Zé Registra®</strong></a>
    <p class="eyebrow">Privacidade</p>
    <h1>Excluir meus dados</h1>
    <p>Informe o e-mail que você usou para entrar em contato conosco. Vamos enviar um link de confirmação -- seus dados só são apagados depois de você confirmar.</p>
    <form id="privacy-delete-form">
      <label>E-mail<input name="email" type="email" required maxlength="254" autocomplete="email"></label>
      <button type="submit">Solicitar exclusão</button>
      <div id="privacy-message" class="status-message" role="alert" hidden></div>
    </form>
  </main>
  <script>
    const form = document.querySelector("#privacy-delete-form");
    const msg = document.querySelector("#privacy-message");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      msg.hidden = false;
      msg.className = "status-message loading";
      msg.textContent = "Enviando...";
      try {
        const email = new FormData(form).get("email");
        const resposta = await fetch("/v1/privacidade/solicitar-exclusao", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const dados = await resposta.json().catch(() => ({}));
        msg.className = resposta.ok ? "status-message success" : "status-message error";
        msg.textContent = resposta.ok
          ? (dados.mensagem || "Se o e-mail existir na nossa base, você vai receber instruções.")
          : "Não foi possível enviar sua solicitação. Tente novamente em instantes.";
      } catch {
        msg.className = "status-message error";
        msg.textContent = "Não foi possível enviar sua solicitação. Tente novamente em instantes.";
      }
    });
  </script>
</body>
</html>
