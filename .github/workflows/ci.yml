name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inpi
          POSTGRES_USER: inpi
          POSTGRES_PASSWORD: inpi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inpi -d inpi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://inpi:inpi@localhost:5432/inpi
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
      ADMIN_PASSWORD: Teste-Seguro-123!
      SECURITY_MASTER_KEY: ci-only-security-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --frozen
      - run: uv run ruff check app tests migrations --ignore E501
      - name: Create restricted application role
        run: >-
          docker exec "$(docker ps -q --filter ancestor=postgres:16-alpine)"
          psql -U inpi -d inpi -c
          "CREATE ROLE inpi_app LOGIN PASSWORD 'ci-inpi-app';"
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q
      - name: Prepare E2E administrator
        run: uv run python -m app.bootstrap_admin
      - name: Install E2E browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start application for E2E
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/ze-registra-api.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          cat /tmp/ze-registra-api.log
          exit 1
      - name: Run browser E2E tests
        env:
          E2E_ADMIN_USERNAME: admin
          E2E_ADMIN_PASSWORD: Teste-Seguro-123!
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/e2e/
          if-no-files-found: ignore
      - name: Verify tenant RLS contract
        run: >-
          docker exec "$(docker ps -q --filter ancestor=postgres:16-alpine)"
          psql -U inpi -d inpi -v ON_ERROR_STOP=1 -c
          "DO \$\$ DECLARE faltantes text; BEGIN
          SELECT string_agg(relname, ', ') INTO faltantes FROM pg_class
          WHERE relname IN ('leads','pesquisas_marca','usuarios_operacoes','sessoes_operacoes','versoes_relatorio_marca','previsoes_registrabilidade','lembretes_crm','prazos_juridicos','notificacoes_juridicas','eventos_juridicos')
          AND (NOT relrowsecurity OR NOT relforcerowsecurity);
          IF faltantes IS NOT NULL THEN RAISE EXCEPTION 'RLS incompleto: %', faltantes; END IF;
          IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname='inpi_app' AND rolbypassrls)
          THEN RAISE EXCEPTION 'inpi_app possui BYPASSRLS'; END IF; END \$\$;"
      - name: Build production image
        run: docker build -t ze-registra-inpi:ci .
