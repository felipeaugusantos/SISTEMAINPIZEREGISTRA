<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal do cliente — Zé Registra</title><link rel="stylesheet" href="/static/styles.css?v=36"></head>
<body class="admin-body"><main class="admin-main">
<section class="admin-heading"><p class="eyebrow">ZÉ REGISTRA</p><h1>Portal do cliente</h1><p>Acompanhe processos, propostas, documentos, pagamentos e pendências.</p></section>
<section id="login" class="admin-card"><h2>Entrar</h2><form id="login-form"><label>E-mail<input name="email" type="email" required></label><label>Senha<input name="senha" type="password" required></label><button class="primary-button" type="submit">Entrar</button><p id="login-error" class="status-message error"></p></form><form id="recovery-form"><h3>Esqueci minha senha</h3><label>E-mail<input name="email" type="email" required></label><button class="secondary-button" type="submit">Enviar recuperação</button><p id="recovery-message" class="status-message"></p></form></section>
<section id="app" hidden><div class="admin-card"><button id="logout" class="secondary-button" type="button">Sair</button><h2 id="hello"></h2><div id="summary"></div></div><div class="admin-card"><h2>Mensagens</h2><div id="messages"></div><form id="message-form"><textarea name="mensagem" required maxlength="4000" placeholder="Escreva uma mensagem para o atendimento"></textarea><button class="primary-button" type="submit">Enviar mensagem</button></form></div><div class="admin-card"><h2>Enviar documento</h2><form id="file-form"><input name="arquivo" type="file" required><button class="primary-button" type="submit">Enviar arquivo</button></form></div></section>
</main><script src="/static/portal-cliente.js?v=2" defer></script></body></html>
