<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Confirmar exclusão de dados — Zé Registra</title>
  <link rel="stylesheet" href="/static/styles.css?v=47">
</head>
<body class="auth-body">
  <main class="auth-card">
    <a href="/" class="auth-brand"><img src="/static/assets/personagem.png" alt=""><strong>Zé Registra®</strong></a>
    <p class="eyebrow">Privacidade</p>
    <h1>Confirmar exclusão dos seus dados</h1>
    <div id="privacy-message" class="status-message loading" role="alert">Confirmando...</div>
  </main>
  <script>
    const msg = document.querySelector("#privacy-message");
    const token = new URLSearchParams(location.hash.slice(1)).get("token");
    if (!token) {
      msg.className = "status-message error";
      msg.textContent = "Link inválido -- faltou o token de confirmação.";
    } else {
      fetch("/v1/privacidade/confirmar-exclusao", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token }),
      })
        .then((resposta) => resposta.json())
        .then((dados) => {
          const sucesso = dados.status === "ok";
          msg.className = sucesso ? "status-message success" : "status-message error";
          msg.textContent = dados.mensagem || (sucesso ? "Seus dados foram removidos." : "Não foi possível confirmar.");
        })
        .catch(() => {
          msg.className = "status-message error";
          msg.textContent = "Não foi possível confirmar. Tente novamente em instantes.";
        });
    }
  </script>
</body>
</html>
