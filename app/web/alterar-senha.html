<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Trocar senha — Centro de operações</title><link rel="stylesheet" href="/static/styles.css?v=58"><script src="/static/auth-pages.js?v=2" defer></script></head>
<body class="auth-body"><main class="auth-card"><a href="/" class="auth-brand"><img src="/static/assets/personagem.png" alt=""><strong>Zé Registra®</strong></a><p class="eyebrow">Segurança</p><h1>Defina sua senha</h1><p>Crie uma senha exclusiva. Depois da alteração, as outras sessões serão encerradas.</p><form id="password-form"><label>Senha atual<input name="senha_atual" type="password" autocomplete="current-password" required></label><label>Nova senha<input name="nova_senha" type="password" minlength="12" autocomplete="new-password" aria-describedby="password-rules" required></label><ul id="password-rules" class="auth-password-rules" aria-label="Requisitos da nova senha"><li data-password-rule="length">Pelo menos 12 caracteres</li><li data-password-rule="lower">Uma letra minúscula</li><li data-password-rule="upper">Uma letra maiúscula</li><li data-password-rule="number">Um número</li><li data-password-rule="special">Um caractere especial</li></ul><label>Confirmar nova senha<input name="confirmacao" type="password" minlength="12" autocomplete="new-password" required></label><button type="submit">Salvar nova senha</button><div id="auth-message" class="status-message" role="alert" aria-live="polite"></div></form></main></body></html>
