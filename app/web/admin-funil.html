<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>Funil e produtividade — Zé Registra</title>
  <link rel="stylesheet" href="/static/styles.css?v=33"><link rel="stylesheet" href="/static/admin-financeiro.css?v=6"><link rel="stylesheet" href="/static/admin-funil.css?v=1">
  <script src="/static/admin-shell.js?v=34" defer></script><script src="/static/admin-funil.js?v=1" defer></script>
</head>
<body class="admin-body" data-admin-section="funil-dashboard">
  <main class="admin-main finance-main">
    <section class="finance-hero">
      <div><p class="eyebrow">COMERCIAL</p><h1>Funil e produtividade</h1><p>Conversão do funil de atendimento, motivos de perda e desempenho por responsável.</p></div>
      <div class="hero-actions"><a class="secondary-button" href="/admin/leads">Ver leads</a></div>
    </section>

    <section class="funil-tiles" id="funil-tiles"></section>
    <section class="finance-card">
      <header class="finance-list-heading"><div><p class="eyebrow">FUNIL</p><h2>Oportunidades por fase</h2><p>Distribuição atual das oportunidades ativas ao longo do funil.</p></div></header>
      <div id="funil-bars" class="funil-bars"></div>
    </section>
    <div class="funil-2col">
      <section class="finance-card">
        <header class="finance-list-heading"><div><p class="eyebrow">PERDAS</p><h2>Motivos de perda</h2></div></header>
        <div id="funil-motivos"></div>
      </section>
      <section class="finance-card">
        <header class="finance-list-heading"><div><p class="eyebrow">EQUIPE</p><h2>Produtividade por responsável</h2></div></header>
        <div id="funil-prod"></div>
      </section>
    </div>
