services:
  api:
    environment:
      APP_ENV: production
      BOOTSTRAP_ADMIN: "false"
      ADMIN_FORCE_HTTPS: "true"
      INTEGRATION_AUTH_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?configure CORS_ALLOWED_ORIGINS}
      HEALTH_API_KEY: ${HEALTH_API_KEY:?configure HEALTH_API_KEY}
      SECURITY_MASTER_KEY: ${SECURITY_MASTER_KEY:?configure SECURITY_MASTER_KEY}
      AUDIT_IP_SALT: ${AUDIT_IP_SALT:?configure AUDIT_IP_SALT}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?configure ADMIN_PASSWORD}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  worker:
    environment:
      APP_ENV: production
      BOOTSTRAP_ADMIN: "false"
    restart: unless-stopped

  rpi-sync:
    environment:
      APP_ENV: production
      BOOTSTRAP_ADMIN: "false"
    restart: unless-stopped
