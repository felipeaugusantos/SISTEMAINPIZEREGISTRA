[project]
name = "inpi-api"
# Metadado estático do pacote -- a versão real de cada deploy é rastreada
# via docker/deploy.sh (.deploy-version no VPS + env var APP_VERSION),
# exposta em settings.app_version e na Central de Atualizações. Este campo
# não é lido por nenhuma ferramenta operacional do projeto.
version = "0.0.0"
description = "API de pesquisa indicativa de marcas publicadas pelo INPI Brasil"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.2,<3",
    "asyncpg>=0.30,<1",
    "defusedxml>=0.7,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<0.28",
    "pgvector>=0.3,<0.4",
    "pypdf>=6.0,<7",
    "pydantic-settings>=2.7,<3",
    "reportlab>=4.2,<5",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
    "tzdata>=2025.2",
    "cryptography>=49,<50",
    "redis>=5,<7",
    "dnspython>=2.7,<3",
    "authlib>=1.4,<2",
    "python-multipart>=0.0.18,<0.1",
    "openpyxl>=3.1,<4",
    "pillow>=12.1.1,<13.0",
    "boto3>=1.35,<2",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# So relatorio por enquanto (Fase 2 da reanalise, 12/09/2026) -- sem
# --cov-fail-under no CI ainda, precisa de uma medicao real primeiro pra
# saber que limiar faz sentido sem travar o pipeline sem necessidade.
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["apresentacao"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Security/Query fazem parte do idioma do FastAPI e sao seguros em argument defaults.
  extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "fastapi.Query", "fastapi.File"]
