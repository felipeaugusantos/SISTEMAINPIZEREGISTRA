name: Centro de Operações - Navegador
on:
  pull_request:
    paths:
      - 'app/web/admin-leads.html'
      - 'app/web/admin-consulta.html'
      - 'app/web/admin-analise.html'
      - 'app/web/static/**'
      - 'tests/frontend/**'
      - '.github/workflows/operations-usability.yml'
permissions:
  contents: read
jobs:
  operations-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Testar fluxos do Centro com APIs simuladas
        env:
          OPERATIONS_SCREENSHOTS: test-results/operations-screenshots
        run: node --test tests/frontend/operations-navigation.test.cjs tests/frontend/operations-return.test.cjs tests/frontend/operations-lists.test.cjs tests/frontend/lead-dialog.test.cjs tests/frontend/operations-usability.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations-screenshots
          path: test-results/operations-screenshots
          if-no-files-found: ignore
