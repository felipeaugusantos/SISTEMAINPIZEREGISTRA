<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>Consulta RPI - Zé Registra</title>
  <link rel="stylesheet" href="/static/styles.css?v=61"><link rel="stylesheet" href="/static/admin-consulta-rpi.css?v=10">
  <style>
    #rpi-query-form{display:grid;grid-template-columns:minmax(320px,1fr) auto auto;gap:16px;align-items:end;margin-top:18px}
    #rpi-query-form label{display:grid;min-width:0;gap:6px;color:#263d32;font-size:.74rem;font-weight:800}
    #rpi-query-form label span{display:block;line-height:1.2;white-space:nowrap}
    #rpi-query-form input[name="busca"]{width:100%;min-height:44px;box-sizing:border-box;padding:10px 13px;border:1px solid #cbd4cd;border-radius:12px!important;background:#fff;font:inherit}
    #rpi-query-form button{min-height:44px;padding:10px 18px;border-radius:10px!important;white-space:nowrap}
    @media(max-width:900px){#rpi-query-form{grid-template-columns:minmax(0,1fr) auto auto}}
    @media(max-width:620px){#rpi-query-form{grid-template-columns:1fr}#rpi-query-form label:first-child{grid-column:auto}}
  </style>
  <script src="/static/admin-shell.js?v=50" defer></script><script src="/static/admin-consulta-rpi.js?v=9" defer></script>
</head>
<body class="admin-body" data-admin-section="config-rpi">
<main class="admin-main rpi-query-main">
  <section class="rpi-query-hero"><div><p class="eyebrow">CONFIGURAÇÃO</p><h1>Consulta RPI</h1><p>Consulte publicações sincronizadas da Revista da Propriedade Industrial e abra o processo relacionado.</p></div><a class="secondary-button" href="/admin/processos-monitorados">Processos monitorados</a></section>
  <section class="rpi-query-card"><div class="rpi-revista-toolbar"><div><p class="eyebrow">REVISTAS DISPONÍVEIS</p><h2>Selecione uma RPI</h2></div><div class="rpi-revista-pagination"><button id="rpi-revista-prev" class="secondary-button" type="button">Anterior</button><span id="rpi-revista-page"></span><button id="rpi-revista-next" class="secondary-button" type="button">Próxima</button></div></div><div id="rpi-revista-list" class="rpi-revista-list"><p class="rpi-empty">Carregando revistas RPI…</p></div><form id="rpi-query-form"><label><span>Buscar processo, marca, procurador ou publicação</span><input name="busca" maxlength="150" placeholder="Ex.: número, titular ou despacho"></label><input name="numero_rpi" id="rpi-selected-number" type="hidden"><button id="rpi-open-records" class="primary-button" type="submit" disabled>Abrir registros da RPI</button><button id="rpi-query-clear" class="secondary-button" type="button">Limpar</button></form></section>
  <div id="rpi-query-message" class="status-message" role="status"></div>
  <section class="rpi-results-card"><header><div><p class="eyebrow">PUBLICAÇÕES ENCONTRADAS</p><h2>Resultados da RPI</h2></div><span id="rpi-query-count"></span></header><div id="rpi-query-results"></div><nav id="rpi-query-pagination" class="rpi-pagination" hidden><button id="rpi-query-prev" class="secondary-button" type="button">Anterior</button><span id="rpi-query-page"></span><button id="rpi-query-next" class="secondary-button" type="button">Próxima</button></nav></section>
</main>
</body>
</html>
