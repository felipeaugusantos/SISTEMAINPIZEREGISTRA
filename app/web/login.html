<body class="auth-body"><main class="auth-card"><a href="/" class="auth-brand"><img src="/static/assets/personagem.png" alt=""><strong>Zé Registra®</strong></a><p class="eyebrow">Centro de operações</p><h1>Entrar</h1><p>Acesso individual, protegido e auditado.</p><form id="login-form"><label>Usuário ou e-mail<input name="identificador" autocomplete="username" required></label><label>Senha<input name="senha" type="password" autocomplete="current-password" required></label><label>Código de segurança <small>(se MFA estiver ativo)</small><input name="codigo_mfa" inputmode="numeric" autocomplete="one-time-code" maxlength="20"></label><button type="submit">Entrar</button><a class="secondary-button auth-secondary-link" href="/esqueci-senha">Esqueci minha senha</a><div id="auth-message" class="status-message" role="alert"></div></form></main></body></html>
