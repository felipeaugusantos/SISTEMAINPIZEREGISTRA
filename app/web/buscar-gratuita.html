<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Busca gratuita de marca — Zé Registra</title>
  <link rel="stylesheet" href="/static/buscar-gratuita.css?v=1">
</head>
<body><main class="card"><div class="eyebrow">Zé Registra</div><h1>Descubra o caminho para proteger sua marca.</h1><p>Faça uma busca inicial gratuita. Nossa equipe recebe seus dados, qualifica a oportunidade e retorna com os próximos passos.</p>
  <form id="lead-form"><div class="grid"><label>Nome completo<input name="nome" required minlength="2"></label><label>E-mail<input name="email" type="email" required></label><label>WhatsApp<input name="telefone" required minlength="10" placeholder="(16) 99999-9999"></label><label>Marca que deseja pesquisar<input name="marca" required></label></div><label class="honeypot">Website<input name="website" tabindex="-1" autocomplete="off"></label><label class="consent-label"><input name="aceite_privacidade" type="checkbox" required class="consent-checkbox"> Aceito o contato sobre esta pesquisa e a política de privacidade.</label><button id="submit" type="submit">Iniciar busca gratuita</button><div id="status" class="status" role="status"></div></form>
</main><script src="/static/buscar-gratuita.js?v=1"></script></body></html>
