# Limite de requisicoes no Nginx (auditoria de seguranca de 13/10/2026, item 9).
# Instalar em /etc/nginx/conf.d/zeregistra-limit-req.conf (contexto http) e
# habilitar no site com as linhas `limit_req` do nginx-zeregistra.conf.
# Camada extra: o app ja limita por IP (app/ratelimit.py); aqui o Nginx barra o
# excesso ANTES de chegar ao Python/banco.
#
# Rotas sensiveis (login, recuperacao, convite, MFA, portal e privacidade) entram
# na zona zr_auth; as demais nao tem chave (vazia = nao contabiliza) e so contam
# na zona geral. Atras de NAT/CGNAT muitos usuarios dividem um IP: por isso os
# valores sao folgados -- ajuste olhando o log antes de apertar.
map $uri $zr_auth_chave {
    default "";
    ~^/v1/auth/(login|recuperacao|convites|mfa) $binary_remote_addr;
    ~^/v1/portal/(login|recuperacao) $binary_remote_addr;
    ~^/v1/privacidade/ $binary_remote_addr;
}

limit_req_zone $zr_auth_chave zone=zr_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=zr_geral:10m rate=600r/m;
limit_req_status 429;
limit_req_log_level warn;
