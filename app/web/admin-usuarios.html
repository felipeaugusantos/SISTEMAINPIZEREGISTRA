<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Usuários e acessos — Zé Registra</title><link rel="stylesheet" href="/static/styles.css?v=37"><script src="/static/admin-shell.js?v=36" defer></script><script src="/static/admin-usuarios.js?v=5" defer></script></head>
<body class="admin-body" data-admin-section="users"><main class="admin-main admin-dashboard"><section class="admin-overview-hero"><div><p class="eyebrow">Segurança administrativa</p><h1>Usuários e acessos</h1><p>Perfis sugerem acessos; a matriz permite ajustar cada operador.</p></div><button id="new-user" class="primary-button" type="button">Novo usuário</button></section><div id="users-message" class="status-message loading">Carregando usuários…</div><section class="overview-section"><header><div><p class="eyebrow">Equipe</p><h2>Contas cadastradas</h2></div></header><div id="users-list" class="users-list"></div></section></main>
<dialog id="user-dialog" class="user-dialog"><form id="user-form"><header><h2 id="user-form-title">Novo usuário</h2><button type="button" data-close aria-label="Fechar">×</button></header><input type="hidden" name="id"><div class="user-fields"><label><span class="req">Nome</span><input name="nome" required></label><label><span class="req">Usuário</span><input name="usuario" pattern="[a-zA-Z0-9._-]{2,80}" required></label><label><span class="req">E-mail</span><input name="email" type="email" required></label><label>Cargo<input name="cargo"></label><label>Perfil<select name="perfil"></select></label><label class="active-field"><input name="ativo" type="checkbox" checked><span>Usuário ativo</span></label></div><h3>Permissões específicas</h3><p id="permission-help" class="form-help">Marque exatamente os módulos e ações liberados para esta conta.</p><div id="permission-matrix" class="permission-matrix"></div><div id="user-form-message" class="status-message"></div><footer><button type="button" class="secondary-button" data-close>Cancelar</button><button class="primary-button" type="submit">Salvar acesso</button></footer></form></dialog></body></html>
