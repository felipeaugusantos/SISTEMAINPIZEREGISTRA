<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Clicksign — Configuração</title><link rel="stylesheet" href="/static/styles.css?v=61"><link rel="stylesheet" href="/static/admin-clicksign.css?v=2"><script src="/static/admin-shell.js?v=49" defer></script><script src="/static/admin-clicksign.js?v=2" defer></script></head><body class="admin-body" data-admin-section="config-clicksign"><main class="admin-main"><section class="admin-overview-hero"><div><p class="eyebrow">Configuração</p><h1>Clicksign</h1><p>Configure e acompanhe a integração de assinatura eletrônica das propostas.</p></div></section><div id="clicksign-message" class="status-message loading" role="status">Carregando configuração…</div><section class="overview-section"><header><div><p class="eyebrow">Integração</p><h2>Ambiente Clicksign</h2></div></header><div id="clicksign-status" class="clicksign-status-grid"></div></section><section class="overview-section clicksign-help"><header><div><p class="eyebrow">Credenciais</p><h2>Configurar integração</h2></div></header><form id="clicksign-form" class="clicksign-form"><label>Ambiente<select name="ambiente"><option value="sandbox">Sandbox / homologação</option><option value="producao">Produção</option></select></label><label>URL do webhook<input name="webhook_url" type="url" placeholder="https://app.zeregistra.com.br/v1/webhooks/clicksign"></label><label class="clicksign-check"><input name="habilitado" type="checkbox"> Habilitar integração</label><label>Token da API <small>deixe vazio para manter o token atual</small><input name="api_token" type="password" autocomplete="new-password"></label><label>Segredo do webhook <small>deixe vazio para manter o segredo atual</small><input name="webhook_secret" type="password" autocomplete="new-password"></label><button class="primary-button" type="submit">Salvar configuração</button><span id="clicksign-save-message" role="status"></span></form><p>O token é criptografado antes de ser salvo e nunca é exibido novamente.</p></section></main></body></html>
