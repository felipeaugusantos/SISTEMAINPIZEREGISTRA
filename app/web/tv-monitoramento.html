<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Monitoramento — TV</title>
  <link rel="stylesheet" href="/static/tv-monitoramento.css?v=10">
  <script src="/static/tv-monitoramento.js?v=9" defer></script>
</head>
<body class="tv">
  <header class="tv-topo">
    <div><h1>Monitoramento</h1><p>Zé Registra e EZRA ERP em tempo real</p></div>
    <div class="tv-relogio"><span id="tv-hora">--:--</span><small id="tv-atualizado">Carregando…</small></div>
  </header>
  <div id="tv-aviso" class="tv-aviso" role="status" hidden></div>
  <main class="tv-grade">
    <section id="tv-zeregistra" class="tv-cartao" aria-label="Zé Registra"></section>
    <section id="tv-erp" class="tv-cartao" aria-label="EZRA ERP"></section>
  </main>
  <section id="tv-backup" class="tv-backup" aria-label="Backup"></section>
  <section id="tv-disponibilidade" class="tv-backup tv-disponibilidade" aria-label="Disponibilidade"></section>
</body>
</html>
