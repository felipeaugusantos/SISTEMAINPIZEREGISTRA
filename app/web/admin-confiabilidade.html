<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Confiabilidade — Zé Registra</title><link rel="stylesheet" href="/static/styles.css?v=18"><script src="/static/admin-shell.js?v=19" defer></script><script src="/static/admin-confiabilidade.js?v=2" defer></script></head>
<body class="admin-body" data-admin-section="reliability"><main class="admin-main admin-dashboard"><section class="admin-overview-hero"><div><p class="eyebrow">Governança local</p><h1>Confiabilidade e LGPD</h1><p>Acompanhe limites, fila, retenção e identidade visual da organização.</p></div><button id="enable-mfa" class="primary-button" type="button">Ativar MFA nesta conta</button></section><div id="reliability-message" class="status-message loading">Carregando…</div><section class="overview-section"><header><div><p class="eyebrow">Saúde</p><h2>Uso e processamento</h2></div></header><div id="reliability-metrics" class="dashboard-metrics"></div></section><section class="overview-section"><header><div><p class="eyebrow">Configuração</p><h2>Marca e privacidade</h2></div></header><form id="reliability-form" class="user-fields"><label>Nome exibido<input name="nome_exibido"></label><label>Cor principal<input name="cor_primaria" type="color" value="#006b4f"></label><label>URL do logotipo<input name="logo_url" type="url"></label><label>Retenção (dias)<input name="retencao_dados_dias" type="number" min="30" max="3650" required></label><label>Versão da política<input name="politica_privacidade_versao" required></label><button class="primary-button" type="submit">Salvar configuração</button></form></section><section class="overview-section"><header><div><p class="eyebrow">Processos assíncronos</p><h2>Rotinas de segurança</h2></div></header><button class="secondary-button" type="button" data-job="privacidade.verificar_retencao" data-label="Verificar retenção">Verificar retenção</button><button class="secondary-button" type="button" data-job="assinaturas.verificar" data-label="Verificar trials">Verificar trials</button><div id="job-status" class="status-message" role="status" aria-live="polite">Selecione uma rotina para iniciar a verificação.</div></section></main></body></html>
