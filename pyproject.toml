[project]
name = "inpi-api"
version = "0.1.0"
description = "API de pesquisa indicativa de marcas publicadas pelo INPI Brasil"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.2,<3",
    "asyncpg>=0.30,<1",
    "defusedxml>=0.7,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pypdf>=5.7,<6",
    "pydantic-settings>=2.7,<3",
    "reportlab>=4.2,<6",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
    "tzdata>=2025.2",
    "cryptography>=44,<47",
    "redis>=5,<7",
    "dnspython>=2.7,<3",
    "authlib>=1.4,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apresentacao"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Security/Query fazem parte do idioma do FastAPI e sao seguros em argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "fastapi.Query"]
