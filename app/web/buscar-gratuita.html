<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Busca gratuita de marca — Zé Registra</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#16352c;background:#f2f6f1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:760px;width:100%;background:#fffdf9;border:1px solid #d7dfd7;border-radius:24px;padding:clamp(28px,6vw,64px);box-shadow:0 20px 60px #16352c16}.eyebrow{letter-spacing:.16em;text-transform:uppercase;color:#08734f;font-size:12px;font-weight:700}h1{font-family:Georgia,serif;font-size:clamp(36px,6vw,64px);line-height:1;margin:12px 0}p{line-height:1.6;color:#52625c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}@media(max-width:620px){.grid{grid-template-columns:1fr}}label{display:grid;gap:7px;font-size:13px;font-weight:700}input{border:1px solid #cbd7cd;border-radius:12px;padding:13px 14px;font:inherit;background:white}button{margin-top:22px;border:0;border-radius:12px;padding:14px 22px;background:#08734f;color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.status{margin-top:16px;padding:12px;border-radius:10px;background:#edf5ef;display:none}.honeypot{position:absolute;left:-10000px}
  </style>
</head>
<body><main class="card"><div class="eyebrow">Zé Registra</div><h1>Descubra o caminho para proteger sua marca.</h1><p>Faça uma busca inicial gratuita. Nossa equipe recebe seus dados, qualifica a oportunidade e retorna com os próximos passos.</p>
  <form id="lead-form"><div class="grid"><label>Nome completo<input name="nome" required minlength="2"></label><label>E-mail<input name="email" type="email" required></label><label>WhatsApp<input name="telefone" required minlength="10" placeholder="(16) 99999-9999"></label><label>Marca que deseja pesquisar<input name="marca" required></label></div><label class="honeypot">Website<input name="website" tabindex="-1" autocomplete="off"></label><label style="display:flex;gap:8px;align-items:center;margin-top:18px;font-weight:500"><input name="aceite_privacidade" type="checkbox" required style="width:auto"> Aceito o contato sobre esta pesquisa e a política de privacidade.</label><button id="submit" type="submit">Iniciar busca gratuita</button><div id="status" class="status" role="status"></div></form>
</main><script>const f=document.querySelector('#lead-form'),s=document.querySelector('#status'),b=document.querySelector('#submit');f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;s.style.display='block';s.textContent='Enviando…';const d=Object.fromEntries(new FormData(f));d.origem='landing';d.aceite_privacidade=true;const p=new URLSearchParams(location.search);['utm_source','utm_medium','utm_campaign'].forEach(k=>{const v=p.get(k);if(v)d[k]=v});try{const r=await fetch('/v1/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw new Error();s.textContent='Recebemos seus dados. Em breve nossa equipe entrará em contato.';f.reset()}catch(_){s.textContent='Não foi possível enviar agora. Tente novamente em instantes.'}finally{b.disabled=false}})</script></body></html>
